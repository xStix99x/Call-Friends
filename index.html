<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Google Contacts - Android OS</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for Android Material Look (Roboto & Material Symbols/Icons) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0b0c0e;
            -webkit-tap-highlight-color: transparent;
            color: #e2e2e6;
        }

        /* Container simulating the phone screen */
        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 890px;
            margin: 0 auto;
            background-color: #111318;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* Smooth view transitions */
        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.28s cubic-bezier(0.4, 0.0, 0.2, 1), opacity 0.25s ease;
            background: #111318;
            z-index: 10;
        }

        .view.hidden-view {
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #33353a;
            border-radius: 4px;
        }

        /* Call screen background overlay */
        #call-view {
            background-color: #111318;
            background-size: cover;
            background-position: center;
            color: white;
            z-index: 30;
        }

        .call-overlay {
            background: linear-gradient(to bottom, rgba(17, 19, 24, 0.82) 0%, rgba(17, 19, 24, 0.4) 35%, rgba(17, 19, 24, 0.9) 100%);
        }

        /* Ripple / Press feedback */
        .material-touch:active {
            background-color: rgba(255, 255, 255, 0.08);
        }

        /* Android status bar icons adjustment */
        .status-icon {
            font-size: 14px !important;
        }
    </style>
</head>
<body class="flex items-center justify-center m-0 min-h-screen">

    <div class="phone-container sm:rounded-[36px] border border-gray-800">
        
        <!-- ============================================== -->
        <!-- VIEW 1: MATERIAL YOU GOOGLE CONTACTS           -->
        <!-- ============================================== -->
        <div id="contacts-view" class="view flex flex-col h-full">
            
            <!-- Android Status Bar -->
            <div class="px-6 pt-3 pb-1 flex justify-between items-center text-xs text-gray-300 select-none z-20">
                <span id="status-time" class="font-medium tracking-tight">00:32</span>
                <div class="flex items-center space-x-1.5 opacity-90">
                    <span class="material-icons-outlined status-icon">alarm</span>
                    <span class="material-icons-outlined status-icon">bluetooth</span>
                    <span class="material-icons-outlined status-icon">vibration</span>
                    <span class="material-icons-outlined status-icon">signal_cellular_4_bar</span>
                    <span class="material-icons-outlined status-icon">wifi</span>
                    <span class="text-[11px] font-semibold ml-0.5">78</span>
                </div>
            </div>

            <!-- Floating Search Bar -->
            <div class="px-4 pt-2 pb-2">
                <div class="bg-[#282a2f] text-gray-300 rounded-full px-4 py-2.5 flex items-center shadow-md">
                    <span class="material-icons-outlined text-gray-400 mr-3">search</span>
                    <input type="text" id="search-input" placeholder="Search contacts" 
                           class="bg-transparent border-none outline-none text-gray-200 placeholder-gray-400 w-full text-base font-normal">
                    <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-400 flex items-center justify-center text-xs font-bold text-white ml-2 ring-2 ring-blue-400/40">
                        MW
                    </div>
                </div>
            </div>

            <!-- Header Filter Bar -->
            <div class="px-5 py-2.5 flex justify-between items-center text-gray-300">
                <div class="flex items-center space-x-1.5 cursor-pointer">
                    <span class="material-icons-outlined text-gray-400 text-lg">group</span>
                    <span class="text-sm font-medium">All contacts</span>
                    <span class="material-icons-outlined text-gray-400 text-sm">expand_more</span>
                </div>
                <div class="flex items-center space-x-4 text-gray-400">
                    <span class="material-icons-outlined text-xl cursor-pointer">label_outline</span>
                    <span class="material-icons-outlined text-xl cursor-pointer">tune</span>
                </div>
            </div>

            <!-- Scrollable Content Area -->
            <div class="flex-1 overflow-y-auto px-4 pb-20 space-y-4">
                
                <!-- "Your Info" Card -->
                <div class="bg-[#1f2125] rounded-2xl p-3.5 flex items-center justify-between shadow-sm">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-11 h-11 rounded-full bg-gray-600 overflow-hidden flex items-center justify-center text-gray-300">
                            <span class="material-icons-outlined text-2xl">person</span>
                        </div>
                        <div>
                            <div class="text-[11px] text-gray-400 font-normal">Your info</div>
                            <div class="text-sm font-medium text-gray-100">Matthew Whitehurst</div>
                        </div>
                    </div>
                    <span class="material-icons-outlined text-gray-400 text-xl pr-1">share</span>
                </div>

                <!-- Dynamic Contact Sections (Injected by JS) -->
                <div id="contact-sections" class="space-y-4">
                    <!-- Letter groups will be rendered here -->
                </div>

            </div>

            <!-- Floating Action Button (FAB) -->
            <button class="absolute bottom-20 right-5 w-14 h-14 rounded-2xl bg-[#004f4f] text-[#7cdddd] flex items-center justify-center shadow-lg active:scale-95 transition-transform z-20">
                <span class="material-icons-outlined text-2xl">add</span>
            </button>

            <!-- Bottom Navigation Bar -->
            <nav class="bg-[#191c20] border-t border-gray-800/60 grid grid-cols-3 py-2 px-2 z-20 text-center text-xs">
                <div class="flex flex-col items-center cursor-pointer">
                    <div class="bg-[#004f4f] text-[#c2e7ff] px-5 py-1 rounded-full mb-1">
                        <span class="material-icons-outlined text-lg leading-none">person</span>
                    </div>
                    <span class="text-gray-200 font-medium text-[11px]">Contacts</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer text-gray-400 py-1">
                    <span class="material-icons-outlined text-xl mb-1">stars</span>
                    <span class="text-[11px]">Highlights</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer text-gray-400 py-1">
                    <span class="material-icons-outlined text-xl mb-1">book_online</span>
                    <span class="text-[11px]">Organize</span>
                </div>
            </nav>

        </div>

        <!-- ============================================== -->
        <!-- VIEW 2: CALL SCREEN                            -->
        <!-- ============================================== -->
        <div id="call-view" class="view hidden-view flex flex-col justify-between relative">
            <div class="call-overlay absolute inset-0 z-0 pointer-events-none"></div>

            <!-- Call Screen Header -->
            <div class="z-10 flex flex-col items-center mt-20 space-y-2">
                <h2 id="call-name" class="text-3xl font-normal tracking-wide text-white drop-shadow-md">Contact Name</h2>
                <p id="call-status" class="text-gray-300 text-xs tracking-widest font-light drop-shadow uppercase">Calling...</p>
            </div>

            <!-- Call Controls -->
            <div class="z-10 grid grid-cols-3 gap-6 text-center text-white mb-10 mx-10">
                <div class="flex flex-col items-center space-y-2">
                    <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                        <span class="material-icons-outlined text-2xl">mic_off</span>
                    </div>
                    <span class="text-xs font-normal text-gray-300">Mute</span>
                </div>
                <div class="flex flex-col items-center space-y-2">
                    <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                        <span class="material-icons-outlined text-2xl">dialpad</span>
                    </div>
                    <span class="text-xs font-normal text-gray-300">Keypad</span>
                </div>
                <div class="flex flex-col items-center space-y-2">
                    <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                        <span class="material-icons-outlined text-2xl">volume_up</span>
                    </div>
                    <span class="text-xs font-normal text-gray-300">Speaker</span>
                </div>
            </div>

            <!-- End Call Button -->
            <div class="z-10 mb-14 flex justify-center w-full">
                <button id="end-call-btn" class="bg-red-600 hover:bg-red-700 active:scale-90 transition-transform w-16 h-16 rounded-full flex items-center justify-center shadow-lg">
                    <span class="material-icons-outlined text-white text-3xl">call_end</span>
                </button>
            </div>
        </div>

    </div>

    <!-- Application Script -->
    <script>
        const contacts = [
            {
                id: 1,
                name: "Clarabelle",
                smallPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Clarabelle_Small.jpg?raw=true",
                bigPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Clarabelle_Big.jpg?raw=true",
                audioUrl: "https://github.com/xStix99x/Call-Friends/raw/refs/heads/main/Clarabelle_Audio.mp3"
            },
            {
                id: 2,
                name: "Daisy Duck",
                smallPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Daisy_Small.jpg?raw=true",
                bigPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Daisy_Big.jpg?raw=true",
                audioUrl: "https://github.com/xStix99x/Call-Friends/raw/refs/heads/main/Daisy_Audio.mp3"
            },
            {
                id: 3,
                name: "Donald Duck",
                smallPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Donald_Small.jpg?raw=true",
                bigPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Donald_Big.jpg?raw=true",
                audioUrl: "https://github.com/xStix99x/Call-Friends/raw/refs/heads/main/Donald_Audio.mp3"
            },
            {
                id: 4,
                name: "Goofy",
                smallPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Goofy_Small.jpg?raw=true",
                bigPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Goofy_Big.jpg?raw=true",
                audioUrl: "https://github.com/xStix99x/Call-Friends/raw/refs/heads/main/Goofy_Audio.mp3"
            },
            {
                id: 5,
                name: "Mickey Mouse",
                smallPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Mickey%20Mouse_Small.jpg?raw=true",
                bigPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Mickey%20Mouse_Big.jpg?raw=true",
                audioUrl: "https://github.com/xStix99x/Call-Friends/raw/refs/heads/main/Mickey_Audio.mp3"
            },
            {
                id: 6,
                name: "Minnie Mouse",
                smallPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Minnie%20Mouse_Small.jpg?raw=true",
                bigPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Minnie%20Mouse_Big.jpg?raw=true",
                audioUrl: "https://github.com/xStix99x/Call-Friends/raw/refs/heads/main/Minnie_Audio.mp3"
            },
            {
                id: 7,
                name: "Peppa Pig",
                smallPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Peppa%20Pig_Small.jpg?raw=true",
                bigPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Peppa%20Pig_Big.jpg?raw=true",
                audioUrl: "https://github.com/xStix99x/Call-Friends/raw/refs/heads/main/Peppa_Audio.mp3"
            },
            {
                id: 8,
                name: "Stitch",
                smallPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Stitch_Small.jpg?raw=true",
                bigPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Stitch_Big.jpg?raw=true",
                audioUrl: "https://github.com/xStix99x/Call-Friends/raw/refs/heads/main/Stitch_Audio.mp3"
            },
            {
                id: 9,
                name: "Tigger",
                smallPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Tigger_Small.jpg?raw=true",
                bigPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Tigger_Big.jpg?raw=true",
                audioUrl: "https://github.com/xStix99x/Call-Friends/raw/refs/heads/main/Tigger_Audio.mp3"
            },
            {
                id: 10,
                name: "Winnie the Pooh",
                smallPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Winnie%20the%20Pooh_Small.jpg?raw=true",
                bigPhoto: "https://github.com/xStix99x/Call-Friends/blob/main/Winnie%20the%20Pooh_Big.jpg?raw=true",
                audioUrl: "https://github.com/xStix99x/Call-Friends/raw/refs/heads/main/Pooh_Audio.mp3"
            }
        ];

        // System Audios
        let currentCharacterAudio = null;
        const ringAudio = new Audio("https://github.com/xStix99x/Call-Friends/raw/refs/heads/main/Phone%20Ring.mp3");
        const endAudio = new Audio("https://github.com/xStix99x/Call-Friends/raw/refs/heads/main/End%20Call.mp3");
        let isCalling = false;

        // DOM elements
        const contactSectionsContainer = document.getElementById('contact-sections');
        const searchInput = document.getElementById('search-input');
        const contactsView = document.getElementById('contacts-view');
        const callView = document.getElementById('call-view');
        const callNameEl = document.getElementById('call-name');
        const callStatusEl = document.getElementById('call-status');
        const endCallBtn = document.getElementById('end-call-btn');

        function initApp() {
            updateClock();
            setInterval(updateClock, 1000);
            renderContacts(contacts);

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                const filtered = contacts.filter(c => c.name.toLowerCase().includes(query));
                renderContacts(filtered);
            });

            endCallBtn.addEventListener('click', terminateCall);
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('status-time').textContent = `${hours}:${mins}`;
        }

        function renderContacts(list) {
            contactSectionsContainer.innerHTML = '';

            if (list.length === 0) {
                contactSectionsContainer.innerHTML = `
                    <div class="text-center py-8 text-gray-500 text-sm">No contacts found</div>
                `;
                return;
            }

            // Sort list alphabetically
            const sorted = [...list].sort((a, b) => a.name.localeCompare(b.name));

            // Group contacts by first character
            const groups = {};
            sorted.forEach(contact => {
                const letter = contact.name.charAt(0).toUpperCase();
                if (!groups[letter]) groups[letter] = [];
                groups[letter].push(contact);
            });

            // Render each letter section card
            Object.keys(groups).sort().forEach(letter => {
                const groupWrapper = document.createElement('div');
                groupWrapper.className = 'space-y-1.5';

                const letterHeader = document.createElement('div');
                letterHeader.className = 'text-xs font-semibold text-gray-400 pl-2 pt-1';
                letterHeader.textContent = letter;

                const card = document.createElement('div');
                card.className = 'bg-[#1f2125] rounded-2xl overflow-hidden divide-y divide-gray-800/60 shadow-sm';

                groups[letter].forEach(contact => {
                    const item = document.createElement('div');
                    item.className = 'flex items-center px-3.5 py-3 material-touch cursor-pointer transition-colors';
                    item.addEventListener('click', () => initiateCall(contact));

                    item.innerHTML = `
                        <img src="${contact.smallPhoto}" alt="${contact.name}" class="w-10 h-10 rounded-full object-cover bg-gray-700 mr-3.5">
                        <span class="text-sm font-normal text-gray-200 tracking-wide">${contact.name}</span>
                    `;
                    card.appendChild(item);
                });

                groupWrapper.appendChild(letterHeader);
                groupWrapper.appendChild(card);
                contactSectionsContainer.appendChild(groupWrapper);
            });
        }

        function initiateCall(contact) {
            if (isCalling) return;
            isCalling = true;

            callNameEl.textContent = contact.name;
            callStatusEl.textContent = "Calling...";
            callView.style.backgroundImage = `url('${contact.bigPhoto}')`;

            contactsView.classList.add('hidden-view');
            callView.classList.remove('hidden-view');

            if (currentCharacterAudio) {
                currentCharacterAudio.pause();
                currentCharacterAudio.currentTime = 0;
            }

            ringAudio.currentTime = 0;
            endAudio.currentTime = 0;

            currentCharacterAudio = new Audio(contact.audioUrl);

            ringAudio.onended = () => {
                if (isCalling) {
                    callStatusEl.textContent = "00:01";
                    currentCharacterAudio.play().catch(e => console.warn("Character audio blocked:", e));
                }
            };

            currentCharacterAudio.onended = () => {
                if (isCalling) {
                    terminateCall();
                }
            };

            ringAudio.play().catch(e => console.warn("Ring audio blocked:", e));
        }

        function terminateCall() {
            if (!isCalling) return;
            isCalling = false;

            callStatusEl.textContent = "Call Ended";

            ringAudio.pause();
            if (currentCharacterAudio) {
                currentCharacterAudio.pause();
            }

            endAudio.currentTime = 0;
            endAudio.play().catch(e => console.warn("End audio blocked:", e));

            setTimeout(() => {
                callView.classList.add('hidden-view');
                contactsView.classList.remove('hidden-view');
            }, 600);
        }

        initApp();
    </script>
</body>
</html>
